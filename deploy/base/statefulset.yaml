# A StatefulSet with one replica, and that shape is a decision rather than a habit.
#
# The inventory comes from the API server and not from a node's kubelet, so this is one
# cluster-wide pod and never a DaemonSet. It needs its volume back after a restart — the
# vulnerability database is 3.2 GB and every SBOM in it was paid for once — and the
# single-attach guarantee of a volumeClaimTemplate is what stops two processes from sharing
# one cache directory. A Deployment with a PVC gives neither.
#
# Two replicas are not a form of availability here: each would hold its own cache, download
# its own database and publish its own findings, and Prometheus would scrape both. What a
# restart costs instead is written down — one slow run, no data — in
# docs/runbooks/running-kiebitzr.md ("Storage").
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kiebitzr
  labels:
    app.kubernetes.io/name: kiebitzr
    app.kubernetes.io/component: matcher
spec:
  replicas: 1
  # No Service of this name exists, and none has to. There is one pod producing metrics and
  # nothing that looks it up: Prometheus is pointed at the pod by the PodMonitor in the
  # example overlay, and a human uses `kubectl port-forward statefulset/kiebitzr`. All this
  # field governs is the per-pod DNS name `kiebitzr-0.kiebitzr.<namespace>.svc`, which nothing
  # here resolves.
  #
  # It is set rather than left out because the field only became optional in the Kubernetes
  # 1.37 API (`+k8s:optional`, alpha), and its json tag carries no `omitempty` — so on
  # anything older an empty value is rejected.
  serviceName: kiebitzr
  # The labels are written out in every manifest instead of being generated by a label
  # transformer. A selector is immutable once applied, so an overlay that adds a common label
  # would make the next `apply` fail on a running installation — with a message about an
  # immutable field rather than about labels.
  selector:
    matchLabels:
      app.kubernetes.io/name: kiebitzr
      app.kubernetes.io/component: matcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiebitzr
        app.kubernetes.io/component: matcher
    spec:
      serviceAccountName: kiebitzr
      securityContext:
        runAsNonRoot: true
        # The release image is distroless `static:nonroot`, whose user is 65532. fsGroup is
        # what makes the cache volume writable for it: a freshly provisioned volume belongs to
        # root, and without this the first run fails on the cache directory rather than on
        # anything interesting.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kiebitzr
          # The tag is set in kustomization.yaml, where it is one line to change and one line
          # to pin by digest.
          image: ghcr.io/obayer/kiebitzr
          # No `args:`. Every flag is also an environment variable (uppercase, hyphens to
          # underscores, prefixed KIEBITZR_), and an argument would *override* the
          # environment — so a value set here would silently win over the ConfigMap an
          # overlay generates, which is the one thing to avoid in a base (ADR 0007).
          envFrom:
            - configMapRef:
                name: kiebitzr
          env:
            # Not a Kiebitzr setting but the Go runtime's: with a memory limit and no
            # GOMEMLIMIT the collector has no reason to stay below it and the OOM killer does
            # the regulating instead. It belongs below the container limit, not at it —
            # page cache from the database and the SBOM files counts against the cgroup, and
            # on the pilot installation the working set peaked at roughly twice the process'
            # resident memory.
            - name: GOMEMLIMIT
              value: 1GiB
            # Where the credential lookup expects a Docker config *directory* — it appends
            # `config.json` itself. Harmless when no Secret is mounted: the lookup finds no
            # file and pulls anonymously, which is what a cluster of public images needs.
            - name: DOCKER_CONFIG
              value: /etc/kiebitzr-registry
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          # `/healthz` answers "the process is up", and deliberately nothing more. Whether a
          # run succeeded, whether the findings are fresh and whether the database is current
          # are *metrics*, with alerts on them — a probe that failed on a stale result would
          # restart the pod and throw away the previous findings, which is the opposite of
          # what this service does when a run fails.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              # No CPU limit on purpose. A run is one core by design — raising Syft's
              # parallelism returned no time at all — but CFS throttling stretches the one
              # long operation this service has, the cold start that catalogues every running
              # image, from tens of minutes into hours. If a limit is required where this
              # runs, give it a whole core or two rather than a fraction.
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/kiebitzr
            # Cataloguing unpacks an image's layers under the operating system's temporary
            # directory, not under the cache directory, and nothing there survives anything.
            - name: tmp
              mountPath: /tmp
            # The optional files below. Mounting a directory rather than single files is what
            # lets an overlay add `build-access.yaml` and an ignore file without touching the
            # pod spec again.
            - name: files
              mountPath: /etc/kiebitzr
              readOnly: true
            # Beside /etc/kiebitzr and not inside it: a mount point nested in a read-only
            # ConfigMap volume is a directory the kubelet would have to create in a file
            # system it cannot write.
            - name: docker-config
              mountPath: /etc/kiebitzr-registry
              readOnly: true
      volumes:
        # On node disk, never `medium: Memory`: the uncompressed layers of the image being
        # catalogued would otherwise sit in the node's RAM next to the heap and the database,
        # and the eviction that follows takes down more than this pod. The limit follows the
        # *largest single image*, not their sum — only one image is catalogued at a time.
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        # Both are `optional: true`, so the base runs without either and an overlay switches
        # them on by creating the object — nothing in the pod spec has to change.
        #
        # `files` carries the YAML files a deployment may supply: the build-access
        # classification and an ignore file. Both are read by path, so the KIEBITZR_* variable
        # naming the path and the key in this ConfigMap have to agree.
        - name: files
          configMap:
            name: kiebitzr-files
            optional: true
        # The registry credentials, and the projection is the part that goes wrong: a Secret
        # of type kubernetes.io/dockerconfigjson stores its content under the key
        # `.dockerconfigjson`, which is not the file name the lookup expects. Hence `items`.
        #
        # An imagePullSecret does not help here — the kubelet uses those to pull this pod's
        # own image and they are never visible inside it. Kiebitzr pulls the images it
        # analyses itself and needs its own copy, as a file.
        - name: docker-config
          secret:
            secretName: kiebitzr-registry
            optional: true
            items:
              - key: .dockerconfigjson
                path: config.json
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # 10 GB, because an update needs room for both databases at once: Grype unpacks
            # the new one into a temporary directory *inside* the cache directory and only
            # then activates it. A volume sized for the active 3.2 GB alone fails an update
            # at some point, and a failed update is a failed run — the findings stop moving
            # and only the freshness metrics say so.
            storage: 10Gi
        # No storageClassName, so the cluster's default is used. Set it in an overlay, and
        # prefer block storage: a daily multi-gigabyte rewrite is the wrong load for an SD
        # card, and a USB SSD on an ARM board is both faster and the right wear profile.

name: release

# Tag push: build, push and sign a release image.
# Weekly schedule: rebuild the latest tag so Go stdlib and base-image fixes land without a
# code change (docs/adr/0002-build-and-release-with-ko-and-keyless-cosign.md).
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless (OIDC)
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/kiebitzr
    steps:
      # Every action is pinned to a commit rather than to a tag, and the trailing comment
      # names the version that commit belonged to. A tag is a moving reference that whoever
      # owns the action can repoint, and this job is the worst place for that: it holds
      # `packages: write` and `id-token: write`, so a moved tag would execute in the one
      # job that pushes an image and signs it with this repository's identity. Renovate
      # keeps digest and comment current (renovate.json, helpers:pinGitHubActionDigests).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select ref
        id: ref
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the release tag
        run: git checkout "${{ steps.ref.outputs.tag }}"

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: go ko

      # Everything except a tag push arrives here without a fresh verdict, and signs anyway
      # unless something stops it. A tag push is the exception: `mise run release` refuses a
      # commit that is not on origin/main, where `ci` has run. A scheduled rebuild exists
      # precisely because the world changed since the tag was checked, and a manual dispatch
      # has no verdict at all — so both take one, and a vulnerable tree is neither rebuilt nor
      # signed. Only `vuln`: on an unchanged tree no other gate can newly fail.
      - name: Refuse to rebuild a vulnerable tree
        if: github.event_name != 'push'
        env:
          GOMEMLIMIT: 5GiB
        run: |
          mise install 'go:golang.org/x/vuln/cmd/govulncheck'
          mise run vuln

      # The notices that ship are generated here rather than taken from the tree, and then
      # verified before anything is built. Two reasons.
      #
      # The obligation is the publisher's and it attaches to the *binary*: what the image has
      # to carry is the license text of the link set it was actually built from. Generating it
      # one step before `ko build` is the only point where those two cannot disagree — a file
      # committed earlier describes whatever the link set was when somebody last ran the task.
      #
      # And it is what keeps a dependency bump mergeable. `licenses:check` used to gate every
      # pull request, so any bump that pulled in one more module arrived red and needed a
      # human to regenerate the file on the bot's branch. Neither bot can do that itself:
      # Renovate's `postUpgradeTasks` is self-hosted-only and the hosted app silently runs
      # nothing, and a workflow that pushed the fix would have to push with `GITHUB_TOKEN`,
      # whose commits trigger no workflows (TODO.md P4) — so the regenerated head would carry
      # no checks at all. Moving the work here removes the gate instead of automating it.
      #
      # `licenses:check` after `licenses` is not redundant. Generating cannot produce a
      # mismatch, but it can produce a notice file with a linked package whose license text is
      # nowhere to be found, and that must stop the release rather than ship in it.
      - name: Collect and verify the third-party notices
        run: |
          mise run licenses
          mise run licenses:check
          if ! git diff --quiet -- cmd/kiebitzr/kodata/THIRD_PARTY_NOTICES; then
            echo "::notice title=notices::the committed snapshot was stale; the image carries the freshly collected set"
          fi

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and push
        id: build
        env:
          VERSION: ${{ steps.ref.outputs.tag }}
        run: |
          digest_ref="$(ko build --bare --sbom=spdx \
            --tags "${VERSION},${VERSION}-$(git rev-parse --short HEAD)" ./cmd/kiebitzr)"
          echo "image=${digest_ref}" >> "$GITHUB_OUTPUT"

      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.image }}"

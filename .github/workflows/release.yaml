name: release

# Tag push: build, push and sign a release image.
# Weekly schedule: rebuild the latest tag so Go stdlib and base-image fixes land without a
# code change (docs/adr/0002-build-and-release-with-ko-and-keyless-cosign.md).
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless (OIDC)
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/kiebitzr
    steps:
      # Every action is pinned to a commit rather than to a tag, and the trailing comment
      # names the version that commit belonged to. A tag is a moving reference that whoever
      # owns the action can repoint, and this job is the worst place for that: it holds
      # `packages: write` and `id-token: write`, so a moved tag would execute in the one
      # job that pushes an image and signs it with this repository's identity. Renovate
      # keeps digest and comment current (renovate.json, helpers:pinGitHubActionDigests).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select ref
        id: ref
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the release tag
        run: git checkout "${{ steps.ref.outputs.tag }}"

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: go ko

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and push
        id: build
        env:
          VERSION: ${{ steps.ref.outputs.tag }}
        run: |
          digest_ref="$(ko build --bare --sbom=spdx \
            --tags "${VERSION},${VERSION}-$(git rev-parse --short HEAD)" ./cmd/kiebitzr)"
          echo "image=${digest_ref}" >> "$GITHUB_OUTPUT"

      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.image }}"
